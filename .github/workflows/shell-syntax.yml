name: Validate shell scripts

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check shell syntax
        run: bash -n src/script/check_update_backend src/script/check_update_pkcon.sh
